steps:
  # 1. Build the unified production container (Next.js Standalone + FastAPI + Nginx)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.cloud'
      - '-t'
      - 'gcr.io/$PROJECT_ID/maadt:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/maadt:latest'
      - '.'

  # 2. Push to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/maadt:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'maadt'
      - '--image'
      - 'gcr.io/$PROJECT_ID/maadt:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/maadt:latest'
  - 'gcr.io/$PROJECT_ID/maadt:$COMMIT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
