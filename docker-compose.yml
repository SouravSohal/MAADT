version: "3.8"

services:
  # ============================================================================
  # MAADT Core Intelligence API & Digital Twin Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maadt-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MAADT_CONFIG_DIR=/app/configs
      - MAADT_DB_PATH=/app/data/maadt_data.db
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # Persistent SQLite telemetry and state database
      - maadt_data:/app/data
      # Live-mount engine and mission configurations for hot edits
      - ./configs:/app/configs:ro
    extra_hosts:
      # Allows backend inside Docker to connect to Ollama running on host OS
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/system/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # MAADT Frontend Operator HUD & 3D WebGL Digital Twin
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    container_name: maadt-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Optional: Containerized Ollama Service (Enable via: docker compose --profile ollama up)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: maadt-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles:
      - ollama

volumes:
  maadt_data:
    name: maadt_data
  ollama_models:
    name: maadt_ollama_models
